name: talk_first
description: "Private one-to-one social conversation app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  cyr_flutter_core:
    path: ../../cyr_flutter_core

  cyr_app_kit:
    path: ../cyr_app_kit

  # Navigation
  go_router: ^14.6.3

  # State management
  flutter_bloc: ^9.1.1

  # Immutable models & states
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0

  # Networking
  dio: ^5.7.0
  retrofit: ^4.9.2
  socket_io_client: ^3.0.2

  # Dependency injection
  get_it: ^9.2.1
  injectable: ^2.5.0

  # UI
  intl: ^0.20.2
  cupertino_icons: ^1.0.8
  flutter_dotenv: ^5.2.1
  flutter_animate: ^4.5.2
  gap: ^3.0.1
  shared_preferences: ^2.3.4
  easy_localization: ^3.0.7
  google_sign_in: ^7.2.0
  flutter_facebook_auth: 7.1.6
  image_picker: ^1.2.1
  firebase_core: ^4.12.1
  firebase_messaging: ^16.2.0
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

dependency_overrides:
  # Keep direct and transitive users on the same local package source while
  # developing against the sibling cyr_flutter_core checkout.
  cyr_flutter_core:
    path: ../../cyr_flutter_core

  # permission_handler 13 requires permission_handler_android 14 which needs
  # AGP 9 / Kotlin 2.3 / compileSdk 37. Pin to the AGP 8-compatible line.
  permission_handler: 12.0.3
  permission_handler_android: 13.0.1

  # Code generation
  freezed: ^3.2.5
  json_serializable: ^6.13.1
  retrofit_generator: ^10.2.5
  injectable_generator: ^2.7.0
  build_runner: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/icons/
    - assets/translations/
